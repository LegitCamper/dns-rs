name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    # Distributes each platform to its own runner (arm64 gets a native
    # ubuntu-24.04-arm runner instead of slow QEMU emulation) and caches
    # each platform's layers separately — this is what actually fixes build
    # time, not just caching on top of emulation.
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}
      # main branch -> `latest`; every build also gets an immutable `:<sha>`
      # tag; a pushed `v1.2.3` tag additionally gets semver tags.
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=semver,pattern={{version}}
        type=sha
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  serverless:
    # Environment-configured, plaintext DoT + DoH behind a platform TLS
    # terminator. Protocol selection and certificate termination are separate
    # features so platforms that only support DoH can build a smaller profile.
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      job-name-prefix: serverless
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      # Distinct scope: these layers are a different cargo feature set, so
      # sharing the default build's cache would thrash it.
      cache-scope: serverless
      build-args: |
        CARGO_ARGS=--no-default-features --features serverless,certless,dot,doh
      set-meta-labels: true
      # Its own package, so the tag ladder matches the default image's exactly
      # rather than carrying a suffix.
      meta-images: ghcr.io/${{ github.repository }}-serverless
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=semver,pattern={{version}}
        type=sha
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
