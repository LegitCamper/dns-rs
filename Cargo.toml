[package]
name = "dns-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.0"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
hickory-proto = "0.26.1"
lru = "0.18.1"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tokio-rustls = "0.26.4"
tokio-util = "0.7.19"
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"
