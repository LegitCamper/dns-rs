[package]
name = "dns-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["dot", "doh-tls"]
dot = ["dep:rustls-pemfile"]
doh-tls = ["axum-server/tls-rustls"]
serverless = []

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false }
base64 = "0.23.0"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std", "async-await"] }
hickory-proto = "0.26.1"
linked_list_allocator = { version = "0.10.6", default-features = false }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2"] }
rustc-hash = "2.1.3"
rustls = "0.23.42"
rustls-pemfile = { version = "2.2.0", optional = true }
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
tokio-rustls = "0.26.4"
tokio-util = "0.7.19"
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.9"

[dev-dependencies]
rcgen = "0.14.8"

[profile.release]
# Cross-crate inlining across the hickory-proto/rustls/tokio boundary, at
# the cost of a slower release build.
lto = true
codegen-units = 1
# The Dockerfile used to strip the binary as a separate step after `cargo
# build`; doing it here means it happens for any release build (Docker or
# not). Deliberately not `panic = "abort"`: that would turn a single
# request's panic into a full-process crash instead of an isolated
# tokio-task failure, which is a bad trade for a long-running server.
strip = true
