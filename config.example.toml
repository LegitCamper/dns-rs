# Example config for default TLS DoT + DoH build.
# Copy to config.toml (or pass --config <path>) and adjust for your deployment.
# Serverless build uses environment variables instead; see README.md.

[server]
# Binds to all interfaces by default. Standard DoT/DoH ports (853/443) require
# root (or CAP_NET_BIND_SERVICE) — use high ports for local testing instead.
# bind_address = "0.0.0.0"
dot_port = 853
doh_port = 443
tls_cert = "/etc/dns-rs/fullchain.pem"
tls_key = "/etc/dns-rs/privkey.pem"
# TTL used for synthesized static-host and sinkhole answers.
default_ttl = 300

[blocking]
# What a blocked domain gets back:
#   "nxdomain" - looks like the domain doesn't exist. Simple, works for any query type.
#   "sinkhole" - resolves successfully, but to sinkhole_ip below instead of its
#                real address (the classic Pi-hole "IP-based" blocking style).
mode = "nxdomain"
sinkhole_ip = "0.0.0.0"

[blocklists]
refresh_interval_secs = 43200  # applies to every URL below
urls = [
  "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts",
]
# Literal domains to always block, in addition to whatever the URLs above
# resolve to. Checked as exact names (not by subdomain).
domains = [
  # "ads.example.com",
]

[whitelist]
# Same shape as [blocklists] above: domains that must never be blocked, even
# if a source in [blocklists] lists them - checked as exact names (not by
# subdomain). Either urls, domains, or both may be used.
refresh_interval_secs = 43200  # applies to every URL below
urls = [
  # "https://example.com/known-good-domains.txt",
]
domains = [
  # "s.youtube.com",
]

# Upstream resolvers. Protocol is inferred from the URL:
#   https://...        -> DoH
#   tls://host:port     -> DoT (add #tls_name if it differs from host, e.g.
#                          connecting to a literal IP but validating against
#                          the provider's real certificate hostname)
#
# Configure at least two, from different providers, so a single upstream
# having a bad moment doesn't take the whole resolver down with it.
#
# strategy:
#   "sequential" - try them in order, falling back to the next on failure.
#                  One request in flight per query.
#   "hedged"    - start with the first upstream, then start each fallback
#                  after 25ms if no answer has arrived. Usually race-like
#                  latency without sending every query to every provider.
#   "race"       - query every upstream at once, use whichever answers
#                  first. Lower worst-case latency and more resilient to a
#                  single flaky upstream, at the cost of every query
#                  hitting every configured upstream.
[upstream]
strategy = "hedged"
urls = [
  "https://cloudflare-dns.com/dns-query",
  "tls://1.1.1.1:853#cloudflare-dns.com",
  "https://dns.quad9.net/dns-query",
]

# Custom domain -> IP overrides, checked before the blocklist and never
# forwarded upstream. One line per host.
[static_hosts]
"nas.home" = "192.168.1.10"
# "printer.home" = "192.168.1.20"

[cache]
enabled = true
# The whole cache is a single fixed-size pool allocated once at startup;
# individual responses are dynamically suballocated from it (each using only
# as many bytes as it actually needs, not a fixed slot sized for the worst
# case). Nothing about serving a request grows, shrinks, or reallocates this
# pool. If it fills up, expired entries are evicted first, then
# least-recently-used ones, until the next response fits.
max_size_bytes = 67108864  # 64 MiB (hard ceiling: 1 GiB)
