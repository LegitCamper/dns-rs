[build]
  image = "ghcr.io/legitcamper/dns-rs-serverless:latest"

[env]
  DNSRS_DOH_PORT = "8053"
  DNSRS_DOT_PORT = "8853"

[[services]]
  protocol = "tcp"
  internal_port = 8053
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    [services.ports.tls_options]
      alpn = ["h2", "http/1.1"]
      versions = ["TLSv1.2", "TLSv1.3"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[[services]]
  protocol = "tcp"
  internal_port = 8853
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 853
    handlers = ["tls"]
    [services.ports.tls_options]
      alpn = ["dot"]
      versions = ["TLSv1.2", "TLSv1.3"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
